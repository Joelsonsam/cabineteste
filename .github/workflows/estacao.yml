name: Estação de impressão (Windows)

on:
  push:
    branches: [main]
    paths: ['estacao/**', '.github/workflows/estacao.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build estacao/EstacaoImpressao.csproj -c Release -nologo
      - uses: actions/upload-artifact@v4
        with:
          name: estacao-impressao-windows
          path: |
            estacao/bin/Release/net48/EstacaoImpressao.exe
            estacao/bin/Release/net48/EstacaoImpressao.exe.config
