name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        alvo: [celular, totem]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test

      - name: Gerar app web
        run: npm run build
        env:
          VITE_TARGET: ${{ matrix.alvo }}

      - run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ matrix.alvo == 'totem' && 'Totem' || 'Celular' }}Debug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cabine-${{ matrix.alvo }}-apk
          path: android/app/build/outputs/apk/${{ matrix.alvo }}/debug/*.apk
          retention-days: 30
